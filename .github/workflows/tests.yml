name: Regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Install CPU test environment
        run: |
          uv venv --python 3.12
          uv pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements-test.txt
      - name: Check runner syntax
        run: bash -n scripts/run_all_experiments.sh
      - name: Run regression tests
        run: uv run --no-project python -m pytest tests -q
